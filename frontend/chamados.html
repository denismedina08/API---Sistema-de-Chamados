<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chamados - Sistema de Chamados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
  <div id="menu"></div>
  <main class="container pb-5">
    <div id="alertas"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Chamados</h1>
      <button class="btn btn-primary" id="btn-novo">Novo chamado</button>
    </div>

    <form id="form-filtros" class="card card-body mb-3">
      <div class="row g-2">
        <div class="col-6 col-md"><select id="filtro-status" class="form-select"></select></div>
        <div class="col-6 col-md"><select id="filtro-prioridade" class="form-select"></select></div>
        <div class="col-6 col-md"><select id="filtro-cliente" class="form-select"></select></div>
        <div class="col-6 col-md"><select id="filtro-categoria" class="form-select"></select></div>
        <div class="col-6 col-md"><select id="filtro-tecnico" class="form-select"></select></div>
        <div class="col-12 col-md-auto text-nowrap">
          <button type="submit" class="btn btn-secondary">Filtrar</button>
          <button type="button" class="btn btn-outline-secondary" id="btn-limpar">Limpar</button>
        </div>
      </div>
    </form>

    <div class="card"><div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead><tr><th>#</th><th>Título</th><th>Cliente</th><th>Categoria</th><th>Prioridade</th><th>Status</th><th>Técnico</th><th>Abertura</th><th class="text-end">Ações</th></tr></thead>
        <tbody id="tabela-corpo"></tbody>
      </table>
    </div></div>

    <div class="modal fade" id="modal-chamado" tabindex="-1">
      <div class="modal-dialog modal-lg"><div class="modal-content">
        <form id="form-chamado">
          <div class="modal-header">
            <h5 class="modal-title" id="modal-titulo">Novo chamado</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="erro-modal"></div>
            <div class="mb-3"><label class="form-label" for="campo-titulo">Título *</label>
              <input class="form-control" id="campo-titulo" maxlength="150" required></div>
            <div class="mb-3"><label class="form-label" for="campo-descricao">Descrição *</label>
              <textarea class="form-control" id="campo-descricao" rows="4" required></textarea></div>
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label" for="campo-prioridade">Prioridade *</label>
                <select class="form-select" id="campo-prioridade" required></select></div>
              <div class="col-md-6"><label class="form-label" for="campo-tecnico">Técnico (opcional)</label>
                <select class="form-select" id="campo-tecnico"></select></div>
              <div class="col-md-6"><label class="form-label" for="campo-cliente">Cliente *</label>
                <select class="form-select" id="campo-cliente" required></select></div>
              <div class="col-md-6"><label class="form-label" for="campo-categoria">Categoria *</label>
                <select class="form-select" id="campo-categoria" required></select></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Salvar</button>
          </div>
        </form>
      </div></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/chamados.js"></script>
</body>
</html>
