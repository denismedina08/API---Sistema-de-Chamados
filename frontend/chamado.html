<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalhe do chamado - Sistema de Chamados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
  <div id="menu"></div>
  <main class="container pb-5">
    <div id="alertas"></div>

    <p><a href="chamados.html">&larr; Voltar para a lista</a></p>
    <div id="dados"></div>
    <div id="acoes" class="mt-3"></div>

    <h2 class="h5 mt-4">Comentários</h2>
    <ul id="lista-comentarios" class="list-group mb-3"></ul>
    <form id="form-comentario" class="card card-body">
      <div class="row g-2">
        <div class="col-md-3"><input class="form-control" id="comentario-autor" placeholder="Seu nome *" maxlength="120" required></div>
        <div class="col-md-7"><input class="form-control" id="comentario-texto" placeholder="Escreva um comentário *" required></div>
        <div class="col-md-2 d-grid"><button class="btn btn-primary" type="submit">Comentar</button></div>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/chamado.js"></script>
</body>
</html>
